<svg width="420" height="320" viewBox="0 0 420 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Bamboo rod -->
  <rect x="30" y="26" width="360" height="16" rx="4" fill="#FEE101" stroke="#000" stroke-width="3"/>
  <line x1="66" y1="26" x2="66" y2="42" stroke="#000" stroke-width="2" opacity="0.5"/>
  <line x1="102" y1="26" x2="102" y2="42" stroke="#000" stroke-width="2" opacity="0.5"/>
  <line x1="318" y1="26" x2="318" y2="42" stroke="#000" stroke-width="2" opacity="0.5"/>
  <line x1="354" y1="26" x2="354" y2="42" stroke="#000" stroke-width="2" opacity="0.5"/>

  <!-- Palm fronds, top corners -->
  <g stroke="#FEE101" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M14 10 C 34 4, 50 14, 58 30"/>
    <path d="M10 16 C 30 16, 46 26, 52 42"/>
    <path d="M8 26 C 26 30, 40 42, 44 56"/>
  </g>
  <g stroke="#FEE101" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M406 10 C 386 4, 370 14, 362 30"/>
    <path d="M410 16 C 390 16, 374 26, 368 42"/>
    <path d="M412 26 C 394 30, 380 42, 376 56"/>
  </g>

  <!-- Rope 1 + pink frame (tallest drop, tilted left) -->
  <line x1="88" y1="42" x2="80" y2="96" stroke="#000" stroke-width="2"/>
  <g transform="translate(38 96) rotate(-6)">
    <rect x="4" y="4" width="88" height="70" fill="#000" opacity="0.25"/>
    <rect x="0" y="0" width="88" height="70" rx="3" fill="#FF0080" stroke="#000" stroke-width="3"/>
    <rect x="12" y="12" width="64" height="46" fill="#FFFBE8" opacity="0.9"/>
  </g>

  <!-- Rope 2 + yellow frame (shortest drop, tilted right) -->
  <line x1="210" y1="42" x2="216" y2="76" stroke="#000" stroke-width="2"/>
  <g transform="translate(168 76) rotate(5)">
    <rect x="4" y="4" width="88" height="70" fill="#000" opacity="0.25"/>
    <rect x="0" y="0" width="88" height="70" rx="3" fill="#FEE101" stroke="#000" stroke-width="3"/>
    <rect x="12" y="12" width="64" height="46" fill="#FFFBE8" opacity="0.9"/>
  </g>

  <!-- Rope 3 + pink frame (mid drop, tilted left) -->
  <line x1="336" y1="42" x2="330" y2="90" stroke="#000" stroke-width="2"/>
  <g transform="translate(288 90) rotate(-4)">
    <rect x="4" y="4" width="88" height="70" fill="#000" opacity="0.25"/>
    <rect x="0" y="0" width="88" height="70" rx="3" fill="#FF0080" stroke="#000" stroke-width="3"/>
    <rect x="12" y="12" width="64" height="46" fill="#FFFBE8" opacity="0.9"/>
  </g>

  <!-- Laptop on a table, centred low -->
  <g transform="translate(150 216)">
    <rect x="0" y="34" width="120" height="8" rx="1" fill="#000"/>
    <path d="M8 34 L18 -4 H102 L112 34 Z" fill="#0B6839" stroke="#000" stroke-width="3"/>
    <rect x="26" y="6" width="68" height="4" fill="#FEE101" opacity="0.7"/>
    <rect x="26" y="14" width="46" height="4" fill="#FEE101" opacity="0.5"/>
  </g>
</svg>
